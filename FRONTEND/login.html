<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ExpenseFlow</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #111827,
                #2563eb
            );
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            margin: auto;
            border-radius: 12px;
            background: white;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .brand h1 {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .brand p {
            color: #dbeafe;
            font-size: 13px;
        }

        .auth-card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.20);
        }

        .auth-card h2 {
            font-size: 22px;
            margin-bottom: 6px;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6b7280;
        }

        .switch a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

    </style>

</head>


<body>

<div class="auth-container">


    <div class="brand">

        <div class="brand-icon">
            ₹
        </div>

        <h1>ExpenseFlow</h1>

        <p>
            Personal Finance Management
        </p>

    </div>


    <div class="auth-card">

        <h2>
            Welcome Back
        </h2>

        <p class="subtitle">
            Login to manage your finances.
        </p>


        <form id="loginForm">


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>


            <p id="message"></p>

        </form>


        <div class="switch">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>

    </div>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const message =
                document.getElementById("message");


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            try {

                const response =
                    await fetch(
                        "/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email,
                                password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    message.textContent =
                        data.error ||
                        "Login failed.";

                    message.style.color =
                        "#dc2626";

                    return;
                }


                message.textContent =
                    "Login successful!";

                message.style.color =
                    "#15803d";


                setTimeout(
                    function() {
                        window.location.href =
                            "/";
                    },
                    500
                );

            }
            catch (error) {

                message.textContent =
                    "Server error. Please try again.";

                message.style.color =
                    "#dc2626";

            }

        }
    );

</script>

</body>

</html>
